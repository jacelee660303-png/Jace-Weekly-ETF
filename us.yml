name: US ETF Weekly (us/)

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST (미국 장 마감 후)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance
      - name: Build data.json
        working-directory: us
        run: python build_data.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us/data.json
          if git diff --staged --quiet; then echo "변경 없음"; else
            git pull --rebase
            git commit -m "us: $(date -u +%Y-%m-%d) 자동 업데이트"
            git push
          fi
