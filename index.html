<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jace Investment Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0efe9;--card:#fff;--bd:rgba(0,0,0,0.09);
  --tx:#1a1a1a;--t2:#555;--t3:#999;
  --acc:#1e40af;--acc2:#0f766e;--acc3:#7c3aed;
  --mono:'SF Mono','Fira Code','Courier New',monospace;
}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100vh;overflow:hidden}

.top-bar{background:#fff;border-bottom:1px solid var(--bd);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:50px;flex-shrink:0;box-shadow:0 1px 8px rgba(0,0,0,.06);z-index:10}
.top-bar h1{font-size:15px;font-weight:700;letter-spacing:-.3px}
.top-bar h1 span{color:var(--acc)}
.upd-info{font-size:11px;color:var(--t3);font-family:var(--mono);display:flex;align-items:center;gap:7px}
.pulse{width:7px;height:7px;border-radius:50%;background:#16a34a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.reload-btn{background:none;border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--t2);cursor:pointer;font-family:var(--mono)}
.reload-btn:hover{background:#f5f5f0}

.tab-nav{background:#fff;border-bottom:2px solid var(--bd);display:flex;padding:0 16px;flex-shrink:0;z-index:9;overflow-x:auto}
.tab-btn{padding:0 18px;height:44px;border:none;background:none;font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap}
.tab-btn:hover{color:var(--tx)}
.tab-btn.active{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
.tab-btn.active.t2{color:var(--acc2);border-bottom-color:var(--acc2)}
.tab-btn.active.t3{color:var(--acc3);border-bottom-color:var(--acc3)}
.tab-meta{margin-left:auto;display:flex;align-items:center;font-size:10px;color:var(--t3);font-family:var(--mono);padding-right:4px}

.frame-area{flex:1;position:relative;overflow:hidden}
.frame-wrap{position:absolute;inset:0;display:none}
.frame-wrap.active{display:block}
iframe{width:100%;height:100%;border:none;background:#fff}
.frame-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:12px;pointer-events:none;transition:opacity .4s}
.frame-load.hide{opacity:0}
.spin{width:30px;height:30px;border:3px solid #e5e7eb;border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.frame-load .txt{font-size:13px;color:var(--t2)}

@media(max-width:600px){
  .top-bar{padding:0 12px}.top-bar h1{font-size:13px}
  .tab-nav{padding:0 6px}.tab-btn{padding:0 11px;font-size:12px}
  .tab-meta{display:none}
  .upd-info span.lbl{display:none}
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>📈 Jace <span>Weekly</span> ETF</h1>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="upd-info"><div class="pulse"></div><span id="updTxt">최신 자동 업데이트 반영</span></div>
    <button class="reload-btn" onclick="reloadCurrent()">🔄 새로고침</button>
  </div>
</div>

<nav class="tab-nav">
  <button class="tab-btn active" id="tabBtn0" onclick="switchTab(0)">🚨 나스닥 시그널</button>
  <button class="tab-btn t2" id="tabBtn1" onclick="switchTab(1)">🇺🇸 미국 Weekly</button>
  <button class="tab-btn t3" id="tabBtn2" onclick="switchTab(2)">🇰🇷 한국 Weekly</button>
  <div class="tab-meta" id="tabMeta">매주 일요일 자동 업데이트 · GitHub Actions</div>
</nav>

<div class="frame-area">
  <div class="frame-wrap active" id="wrap0">
    <div class="frame-load" id="load0"><div class="spin"></div><div class="txt">나스닥 시그널 불러오는 중...</div></div>
    <iframe id="frame0" title="나스닥 시그널" loading="eager"></iframe>
  </div>
  <div class="frame-wrap" id="wrap1">
    <div class="frame-load" id="load1"><div class="spin"></div><div class="txt">미국 Weekly 불러오는 중...</div></div>
    <iframe id="frame1" title="미국 ETF Weekly" loading="lazy"></iframe>
  </div>
  <div class="frame-wrap" id="wrap2">
    <div class="frame-load" id="load2"><div class="spin"></div><div class="txt">한국 Weekly 불러오는 중...</div></div>
    <iframe id="frame2" title="한국 ETF Weekly" loading="lazy"></iframe>
  </div>
</div>

<script>
const SOURCES = [
  { url: './nasdaq/', meta: '매주 일요일 자동 업데이트 · GitHub Actions' },
  { url: './us/',     meta: '매일 미국 장 마감 후 자동 업데이트 · 1~7주 영업일 롤링' },
  { url: './kr/',     meta: '평일 한국 장 마감 후 자동 업데이트 · N주 = 5×N 영업일' },
];

const N = SOURCES.length;
const loaded = Array(N).fill(false);

function loadFrame(i) {
  if (loaded[i]) return;
  loaded[i] = true;
  const frame = document.getElementById('frame' + i);
  const load  = document.getElementById('load' + i);
  frame.src = SOURCES[i].url + '?t=' + Date.now();
  frame.addEventListener('load', () => { load.classList.add('hide'); }, { once: true });
  setTimeout(() => load.classList.add('hide'), 8000);
}

function switchTab(i) {
  for (let j = 0; j < N; j++) {
    document.getElementById('wrap' + j).classList.toggle('active', j === i);
    document.getElementById('tabBtn' + j).classList.toggle('active', j === i);
  }
  document.getElementById('tabMeta').textContent = SOURCES[i].meta;
  loadFrame(i);
}

function reloadCurrent() {
  const i = Array.from({length: N}, (_, j) => j).find(j => document.getElementById('wrap' + j).classList.contains('active'));
  const frame = document.getElementById('frame' + i);
  const load  = document.getElementById('load' + i);
  load.classList.remove('hide');
  frame.src = SOURCES[i].url + '?t=' + Date.now();
  frame.addEventListener('load', () => load.classList.add('hide'), { once: true });
  setTimeout(() => load.classList.add('hide'), 8000);
  setUpd();
}

function setUpd() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  document.getElementById('updTxt').innerHTML =
    `<span class="lbl">접속: </span>${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())} KST`;
}

document.addEventListener('DOMContentLoaded', () => {
  setUpd();
  loadFrame(0);
});
</script>
</body>
</html>
