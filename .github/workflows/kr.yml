name: KR ETF Weekly (kr/)

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 평일 16:30 KST (한국 장 마감 후)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build kr-weekly-data.json
        working-directory: kr
        run: python build_kr_weekly.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kr/kr-weekly-data.json
          if git diff --staged --quiet; then echo "변경 없음"; else
            git pull --rebase
            git commit -m "kr: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST 자동 업데이트"
            git push
          fi
